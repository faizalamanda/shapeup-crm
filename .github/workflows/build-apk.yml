name: Build ShapeUp POS Android APK

on:
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub
  push:
    paths:
      - 'android-pos-app/**'
      - '.github/workflows/build-apk.yml'
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build APK
        working-directory: android-pos-app
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShapeUp-CRM-POS-app-debug
          path: android-pos-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
